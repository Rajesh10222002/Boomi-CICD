name: Deploy Boomi release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Process to package and deploy
        required: true
        type: choice
        options:
          - Fetch and Process User Data
      version:
        description: New immutable package version (for example 1.1)
        required: true
        type: string
      target:
        description: Destination path
        required: true
        default: dev
        type: choice
        options:
          - dev
          - dev-and-production
      notes:
        description: Release notes
        required: false
        default: Dashboard deployment
        type: string
  push:
    branches: [main]
    paths: ['manifests/release.json']

env:
  BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
  BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
  BOOMI_TOKEN: ${{ secrets.BOOMI_TOKEN }}
  BOOMI_COMPONENT: ${{ inputs.component || '' }}
  BOOMI_PACKAGE_VERSION: ${{ inputs.version || '' }}
  BOOMI_RELEASE_NOTES: ${{ inputs.notes || '' }}
  BOOMI_RELEASE_TARGET: ${{ inputs.target || '' }}

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      release-target: ${{ steps.release.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release path
        id: release
        run: echo "target=$(python scripts/boomi.py target)" >> "$GITHUB_OUTPUT"
      - name: Create packaged components
        run: python scripts/boomi.py package
      - name: Upload immutable package IDs
        uses: actions/upload-artifact@v4
        with:
          name: boomi-packages
          path: packages.json
          if-no-files-found: error

  deploy-dev:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Dev
        run: python scripts/boomi.py deploy dev

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [package, deploy-dev]
    if: needs.package.outputs.release-target == 'dev-and-production'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Prod
        run: python scripts/boomi.py deploy prod