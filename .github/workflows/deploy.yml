name: Deploy Boomi release

permissions:
  contents: read
  issues: write

concurrency:
  group: boomi-release-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      component:
        description: Process to package and deploy
        required: true
        type: choice
        options:
          - Fetch and Process User Data
      version:
        description: New immutable package version (for example 1.1)
        required: true
        type: string
      target:
        description: Destination path
        required: true
        default: dev
        type: choice
        options:
          - dev
          - dev-and-production
      notes:
        description: Release notes
        required: false
        default: Dashboard deployment
        type: string
  push:
    branches: [main]
    paths: ['manifests/release.json']

env:
  BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
  BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
  BOOMI_TOKEN: ${{ secrets.BOOMI_TOKEN }}
  BOOMI_COMPONENT: ${{ inputs.component || '' }}
  BOOMI_PACKAGE_VERSION: ${{ inputs.version || '' }}
  BOOMI_RELEASE_NOTES: ${{ inputs.notes || '' }}
  BOOMI_RELEASE_TARGET: ${{ inputs.target || '' }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      release-target: ${{ steps.release.outputs.target }}
      issue-number: ${{ steps.release.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release path
        id: release
        run: |
          echo "target=$(python scripts/boomi.py target)" >> "$GITHUB_OUTPUT"
          echo "issue=$(python scripts/boomi.py issue)" >> "$GITHUB_OUTPUT"
      - name: Record workflow start
        if: steps.release.outputs.issue != ''
        run: gh issue comment "${{ steps.release.outputs.issue }}" --body "Deployment workflow started. Waiting for DV approval. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  wait-for-dv-approval:
    runs-on: ubuntu-latest
    needs: prepare
    environment: development
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify DV approval protection
        shell: bash
        run: |
          count=$(gh api "repos/${{ github.repository }}/environments/development" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [[ "$count" -lt 1 ]]; then
            echo "::error::The development environment has no Required reviewers rule. Configure and save it before deploying."
            exit 1
          fi
      - name: DV deployment approved
        run: echo "DV deployment approved by GitHub environment reviewer."
      - name: Record DV approval
        if: needs.prepare.outputs.issue-number != ''
        run: gh issue comment "${{ needs.prepare.outputs.issue-number }}" --body "DV approval completed. Package creation can begin."

  package:
    runs-on: ubuntu-latest
    needs: [prepare, wait-for-dv-approval]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create packaged components
        run: python scripts/boomi.py package
      - name: Upload immutable package IDs
        uses: actions/upload-artifact@v4
        with:
          name: boomi-packages
          path: packages.json
          if-no-files-found: error
      - name: Record package creation
        if: needs.prepare.outputs.issue-number != ''
        run: gh issue comment "${{ needs.prepare.outputs.issue-number }}" --body "Immutable package created once and saved as the workflow artifact. Deploying that package to DV."

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [prepare, package]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Dev
        run: python scripts/boomi.py deploy dev
      - name: Validate Dev deployment
        run: python scripts/boomi.py validate dev
      - name: Record Dev validation
        if: needs.prepare.outputs.issue-number != ''
        run: gh issue comment "${{ needs.prepare.outputs.issue-number }}" --body "DV deployment completed and the exact package ID was verified active."

  wait-for-pd-approval:
    runs-on: ubuntu-latest
    needs: [prepare, deploy-dev]
    if: needs.prepare.outputs.release-target == 'dev-and-production'
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify PD approval protection
        shell: bash
        run: |
          count=$(gh api "repos/${{ github.repository }}/environments/production" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [[ "$count" -lt 1 ]]; then
            echo "::error::The production environment has no Required reviewers rule. Configure and save it before deploying."
            exit 1
          fi
      - name: PD deployment approved
        run: echo "PD deployment approved by GitHub environment reviewer."
      - name: Record PD approval
        if: needs.prepare.outputs.issue-number != ''
        run: gh issue comment "${{ needs.prepare.outputs.issue-number }}" --body "PD approval completed. Promoting the same immutable package used in DV."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [prepare, package, deploy-dev, wait-for-pd-approval]
    if: needs.prepare.outputs.release-target == 'dev-and-production'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Prod
        run: python scripts/boomi.py deploy prod
      - name: Validate Prod deployment
        run: python scripts/boomi.py validate prod
      - name: Record Prod validation
        if: needs.prepare.outputs.issue-number != ''
        run: gh issue comment "${{ needs.prepare.outputs.issue-number }}" --body "PD deployment completed and the exact DV-tested package ID was verified active."

  close-release-issue:
    runs-on: ubuntu-latest
    needs: [prepare, wait-for-dv-approval, package, deploy-dev, wait-for-pd-approval, deploy-prod]
    if: always() && github.event_name == 'push'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record release outcome
        shell: bash
        run: |
          issue="${{ needs.prepare.outputs.issue-number }}"
          target="${{ needs.prepare.outputs.release-target }}"
          issue="${issue:-$(python scripts/boomi.py issue)}"
          target="${target:-$(python scripts/boomi.py target)}"
          [[ -n "$issue" ]] || exit 0
          outcome="failed"
          reason="not_planned"

          if [[ "${{ needs.package.result }}" == "success" && "${{ needs.deploy-dev.result }}" == "success" ]]; then
            if [[ "$target" == "dev" || "${{ needs.deploy-prod.result }}" == "success" ]]; then
              outcome="succeeded"
              reason="completed"
            fi
          fi

          message="Deployment $outcome. Prepare: ${{ needs.prepare.result }}; DV approval: ${{ needs.wait-for-dv-approval.result }}; Package: ${{ needs.package.result }}; DV: ${{ needs.deploy-dev.result }}; PD approval: ${{ needs.wait-for-pd-approval.result }}; PD: ${{ needs.deploy-prod.result }}. [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh api --method POST "repos/${{ github.repository }}/issues/$issue/comments" -f body="$message"
          gh api --method PATCH "repos/${{ github.repository }}/issues/$issue" -f state="closed" -f state_reason="$reason"