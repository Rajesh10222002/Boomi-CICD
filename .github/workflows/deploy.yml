name: Deploy Boomi release

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      component:
        description: Process to package and deploy
        required: true
        type: choice
        options:
          - Fetch and Process User Data
      version:
        description: New immutable package version (for example 1.1)
        required: true
        type: string
      target:
        description: Destination path
        required: true
        default: dev
        type: choice
        options:
          - dev
          - dev-and-production
      notes:
        description: Release notes
        required: false
        default: Dashboard deployment
        type: string
  push:
    branches: [main]
    paths: ['manifests/release.json']

env:
  BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
  BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
  BOOMI_TOKEN: ${{ secrets.BOOMI_TOKEN }}
  BOOMI_COMPONENT: ${{ inputs.component || '' }}
  BOOMI_PACKAGE_VERSION: ${{ inputs.version || '' }}
  BOOMI_RELEASE_NOTES: ${{ inputs.notes || '' }}
  BOOMI_RELEASE_TARGET: ${{ inputs.target || '' }}

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      release-target: ${{ steps.release.outputs.target }}
      issue-number: ${{ steps.release.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release path
        id: release
        run: |
          echo "target=$(python scripts/boomi.py target)" >> "$GITHUB_OUTPUT"
          echo "issue=$(python scripts/boomi.py issue)" >> "$GITHUB_OUTPUT"
      - name: Create packaged components
        run: python scripts/boomi.py package
      - name: Upload immutable package IDs
        uses: actions/upload-artifact@v4
        with:
          name: boomi-packages
          path: packages.json
          if-no-files-found: error

  deploy-dev:
    runs-on: ubuntu-latest
    needs: package
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Dev
        run: python scripts/boomi.py deploy dev

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [package, deploy-dev]
    if: needs.package.outputs.release-target == 'dev-and-production'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable package IDs
        uses: actions/download-artifact@v4
        with:
          name: boomi-packages
      - name: Deploy to Prod
        run: python scripts/boomi.py deploy prod

  close-release-issue:
    runs-on: ubuntu-latest
    needs: [package, deploy-dev, deploy-prod]
    if: always() && github.event_name == 'push'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record release outcome
        shell: bash
        run: |
          issue="${{ needs.package.outputs.issue-number }}"
          target="${{ needs.package.outputs.release-target }}"
          issue="${issue:-$(python scripts/boomi.py issue)}"
          target="${target:-$(python scripts/boomi.py target)}"
          [[ -n "$issue" ]] || exit 0
          outcome="failed"
          reason="not_planned"

          if [[ "${{ needs.package.result }}" == "success" && "${{ needs.deploy-dev.result }}" == "success" ]]; then
            if [[ "$target" == "dev" || "${{ needs.deploy-prod.result }}" == "success" ]]; then
              outcome="succeeded"
              reason="completed"
            fi
          fi

          message="Deployment $outcome. Package: ${{ needs.package.result }}; DV: ${{ needs.deploy-dev.result }}; PD: ${{ needs.deploy-prod.result }}. [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh api --method POST "repos/${{ github.repository }}/issues/$issue/comments" -f body="$message"
          gh api --method PATCH "repos/${{ github.repository }}/issues/$issue" -f state="closed" -f state_reason="$reason"