name: Roll back Boomi package

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to restore
        required: true
        type: choice
        options:
          - dev
          - prod
      component_name:
        description: Process name
        required: true
        type: string
      component_id:
        description: Boomi process component ID
        required: true
        type: string
      package_id:
        description: Existing immutable Boomi package ID
        required: true
        type: string
      package_version:
        description: Package version being restored
        required: true
        type: string
      issue_number:
        description: Audit issue number
        required: true
        type: string

concurrency:
  group: boomi-release-${{ github.repository }}
  cancel-in-progress: false

env:
  BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
  BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
  BOOMI_TOKEN: ${{ secrets.BOOMI_TOKEN }}
  BOOMI_ROLLBACK_PACKAGE_ID: ${{ inputs.package_id }}
  BOOMI_ROLLBACK_COMPONENT_NAME: ${{ inputs.component_name }}
  BOOMI_ROLLBACK_COMPONENT_ID: ${{ inputs.component_id }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  wait-for-approval:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}
    steps:
      - name: Verify approval protection
        shell: bash
        run: |
          environment="${{ inputs.target == 'prod' && 'production' || 'development' }}"
          count=$(gh api "repos/${{ github.repository }}/environments/$environment" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [[ "$count" -lt 1 ]]; then
            echo "::error::The $environment environment has no Required reviewers rule."
            exit 1
          fi
      - name: Record approval
        run: gh issue comment "${{ inputs.issue_number }}" --body "Rollback to package ${{ inputs.package_version }} approved for ${{ inputs.target }}."

  rollback:
    runs-on: ubuntu-latest
    needs: wait-for-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and validate package
        run: python scripts/boomi.py rollback "${{ inputs.target }}"
      - name: Record validation
        run: gh issue comment "${{ inputs.issue_number }}" --body "Rollback completed. Package ${{ inputs.package_version }} was verified active in ${{ inputs.target }}."

  close-rollback-issue:
    runs-on: ubuntu-latest
    needs: [wait-for-approval, rollback]
    if: always()
    steps:
      - name: Close audit issue
        shell: bash
        run: |
          outcome="failed"
          reason="not_planned"
          if [[ "${{ needs.rollback.result }}" == "success" ]]; then
            outcome="succeeded"
            reason="completed"
          fi
          gh issue comment "${{ inputs.issue_number }}" --body "Rollback $outcome. Approval: ${{ needs.wait-for-approval.result }}; restore: ${{ needs.rollback.result }}. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh api --method PATCH "repos/${{ github.repository }}/issues/${{ inputs.issue_number }}" -f state="closed" -f state_reason="$reason"
